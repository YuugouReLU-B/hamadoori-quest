missions:
  # ── ①公式LINE友達登録（500pt） ──
  - slug: add-supporter-line-friend
    title: 公式LINEを友だち追加しよう
    quest_category: SNS
    event_category: null
    icon_url: /img/mission-icons/actionboard_icon_work_20250713_ol_add-line-friend.svg
    content: |-
      イベントの案内や新しいスポットの情報は公式LINEからお届けします。友だち追加しておくと見逃しがありません。
      友だち追加が確認できると自動で達成になります。
    difficulty: 1
    required_artifact_type: LINE_FRIEND
    # 500pt: 基礎ポイントとして扱う（企画側の要望）。
    # 既にDBにある既存ミッションのため mission:sync（挿入のみ）では反映されない。
    # 管理画面（/admin/missions）でこのミッションのポイントを500に更新すること。
    points: 500
    max_achievement_count: 1
    is_featured: true
    is_hidden: false
    artifact_label: null
    ogp_image_url: https://tibsocpjqvxxipszbwui.supabase.co/storage/v1/object/public/ogp//7_add_official_line.png

