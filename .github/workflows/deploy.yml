name: Migrate DB (production)

on:
  push:
    # Supabaseプロジェクトは hamadori-quest の1つだけで、staging用の別プロジェクトが無い。
    # develop でも発火させると、develop へのマージが本番DBへマイグレーションを流してしまう。
    # staging環境を用意するまでは main だけにする。
    branches: [main]
  workflow_dispatch: {}

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      # Config parsing env vars (needed for supabase config.toml)
      ENABLE_CONFIRMATIONS: ${{ vars.ENABLE_CONFIRMATIONS }}
      SITE_URL: ${{ vars.SITE_URL }}
      ADDITIONAL_REDIRECT_URLS: ${{ vars.ADDITIONAL_REDIRECT_URLS }}
      # Supabase secrets
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        # DBパスワードは渡さない。渡さなければ CLI が SUPABASE_ACCESS_TOKEN で
        # 一時ログインロールを作って接続する（`Initialising login role...`）。
        # 逆に SUPABASE_DB_PASSWORD を env に置くと CLI はそれを優先し、
        # postgres ロールで直接つなぐためこのフォールバックが働かなくなる。
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations
        timeout-minutes: 10
        run: |
          supabase db push --include-all --yes
          supabase config push --yes

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ミッションは管理画面（/admin）から編集するようになったため、DBが正。
      # ここで毎デプロイ同期すると管理画面の編集が消える。
      # 新環境の初期投入は `pnpm run mission:sync` を手動で1回だけ実行する。

      - name: Sync posting event data
        run: pnpm run posting:sync

      - name: Sync season data
        run: pnpm run season:sync

      - name: Load poster data
        run: pnpm run poster:load-csv

      # Vercelへのデプロイはこのワークフローでは行わない。
      # vercel.json で main/develop の Git 連携を意図的に無効化しており、
      # `npx vercel --prod --yes --scope relu-branch` を手で叩く運用になっている。
      # 手順は docs/20260913_1618_本番デプロイ手順メモ.md を参照。
